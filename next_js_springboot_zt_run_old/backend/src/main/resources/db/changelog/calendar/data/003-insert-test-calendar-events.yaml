databaseChangeLog:
  - changeSet:
      id: 003-insert-test-calendar-events
      author: carlos
      changes:
        - insert:
            tableName: calendar_events
            columns:
              - column: { name: title, value: "Gym Session" }
              - column: { name: description, value: "Leg day" }
