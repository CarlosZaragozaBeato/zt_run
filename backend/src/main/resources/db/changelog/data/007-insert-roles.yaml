databaseChangeLog:
  - changeSet:
      id: 007-insert-role-admin
      author: carlos
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_ADMIN }
              - column: { name: description, value: Administrador del sistema }
      rollback:
        - delete:
            tableName: roles
            where: name = 'ROLE_ADMIN'

  - changeSet:
      id: 008-insert-role-user
      author: carlos
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: ROLE_USER }
              - column: { name: description, value: Usuario estándar }
      rollback:
        - delete:
            tableName: roles
            where: name = 'ROLE_USER'
