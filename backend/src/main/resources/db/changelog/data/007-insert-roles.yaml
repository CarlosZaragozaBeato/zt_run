databaseChangeLog:
  - changeSet:
      id: 007-insert-roles
      author: carlos
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_ADMIN
              - column:
                  name: description
                  value: Administrador del sistema
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_USER
              - column:
                  name: description
                  value: Usuario estándar
      rollback:
        - delete:
            tableName: roles
            where: name IN ('ROLE_ADMIN', 'ROLE_USER')