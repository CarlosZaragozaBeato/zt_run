databaseChangeLog:
  - changeSet:
      id: 014-insert-role-permissions-admin
      author: carlos
      changes:
        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p WHERE r.name = 'ROLE_ADMIN';
      rollback:
        - sql:
            sql: >
              DELETE FROM role_permissions WHERE role_id = (SELECT id FROM roles WHERE name = 'ROLE_ADMIN')

  - changeSet:
      id: 015-insert-role-permissions-user
      author: carlos
      changes:
        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r JOIN permissions p ON p.name = 'USER_READ' WHERE r.name = 'ROLE_USER';
      rollback:
        - sql:
            sql: >
              DELETE FROM role_permissions WHERE role_id = (SELECT id FROM roles WHERE name = 'ROLE_USER')
