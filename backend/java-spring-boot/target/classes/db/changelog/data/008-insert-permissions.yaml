databaseChangeLog:
  - changeSet:
      id: 009-insert-permission-create
      author: carlos
      changes:
        - insert:
            tableName: permissions
            columns:
              - column: { name: name, value: USER_CREATE }
              - column: { name: description, value: Permite crear usuarios }
      rollback:
        - delete:
            tableName: permissions
            where: name = 'USER_CREATE'

  - changeSet:
      id: 010-insert-permission-read
      author: carlos
      changes:
