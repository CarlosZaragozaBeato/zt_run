spring.application.name=ztRun

# -----------------------------
# JWT
# -----------------------------
# TODO change secret jwt
app.jwt.secret=change-me-super-secret-please-generate-long-key
app.jwt.expiration-ms=3600000  # 1h

# ---------------------------------
# DATABASE - PostgreSQL
# ---------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/ztrun_db
spring.datasource.username=ztrun_user
spring.datasource.password=ztrun_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------
# LIQUIBASE
# ---------------------------------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.liquibase.drop-first=false

# ---------------------------------
# H2 CONSOLE (deshabilitado)
# ---------------------------------
spring.h2.console.enabled=false

# ---------------------------------
# LOGGING
# ---------------------------------
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.carloszaragoza=DEBUG
logging.level.liquibase=INFO

